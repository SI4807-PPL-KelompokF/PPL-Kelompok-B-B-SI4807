name: Laravel CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  laravel-tests:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2' # Ubah ke '8.3' jika tim memakai PHP 8.3
        extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite
        coverage: none

    - name: Copy .env
      run: php -r "file_exists('.env') || copy('.env.example', '.env');"

    - name: Install Composer Dependencies
      run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: Install & Build Frontend (Laravel Mix)
      run: |
        npm ci --legacy-peer-deps
        npm run prod

    - name: Generate Key & Permissions
      run: |
        php artisan key:generate
        chmod -R 777 storage bootstrap/cache

    - name: Create SQLite Database (Khusus Testing CI)
      env:
        DB_CONNECTION: sqlite
        DB_DATABASE: ${{ github.workspace }}/database/database.sqlite
      run: |
        mkdir -p database
        touch database/database.sqlite
        php artisan migrate --env=testing --database=sqlite --force

    - name: Run Unit & Feature Tests
      env:
        DB_CONNECTION: sqlite
        DB_DATABASE: ${{ github.workspace }}/database/database.sqlite
      run: php artisan test

    - name: Set up ChromeDriver
      uses: nanasess/setup-chromedriver@v3

    - name: Run Laravel Dusk Browser Tests
      env:
        APP_URL: http://127.0.0.1:8000
        DUSK_DRIVER_URL: http://127.0.0.1:9515
        DB_CONNECTION: sqlite
        DB_DATABASE: ${{ github.workspace }}/database/database.sqlite
      run: |
        mkdir -p vendor/laravel/dusk/bin
        cp "$(which chromedriver)" vendor/laravel/dusk/bin/chromedriver-linux
        chmod -R 0755 vendor/laravel/dusk/bin/
        chromedriver --port=9515 &
        php artisan serve --host=127.0.0.1 --port=8000 &
        sleep 3
        php artisan dusk -v

    - name: Upload Dusk Screenshots & Logs
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: dusk-screenshots
        path: |
          tests/Browser/screenshots
          tests/Browser/console
